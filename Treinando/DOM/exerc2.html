<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
     
<h1>Contador</h1>

<p id =cont>0</p>

<button id ="adc">+</button>
<button id ="red">-</button>
<button id ="zera">zerar</button>


<script>
    let contador = 0; // essa variavel é chamada de varivel de estado

    let valor_contador= document.getElementById("cont")
    let btn1 = document.getElementById("adc");
    let btn2 = document.getElementById("red");
    let btn3 = document.getElementById("zera");
    

    btn1.addEventListener("click" , function(){
        contador += 1
        valor_contador.textContent = contador;
    } )


    btn2.addEventListener("click" , function(){
        contador -= 1
        valor_contador.textContent = contador;
    })


    btn3.addEventListener("click" , function(){
        if(contador > 0 || contador < 1){  //não teria como o contador ser maior que 0
        // e menor que 1 ao mesmo tempo
            contador = 0;
        }
        valor_contador.textContent = contador;
    })


</script>






</body>
</html>
